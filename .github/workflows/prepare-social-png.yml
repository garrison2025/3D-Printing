name: Prepare 1200x630 PNG social preview (one-time static asset)
on:
  push:
    branches: [main]
    paths: [.github/workflows/prepare-social-png.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Convert existing approved SVG art into portable PNG
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert --width 1200 --height 630 public/og-card.svg > public/og-card.png
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p=Path('public/og-card.png')
          b=p.read_bytes()
          assert b[:8]==b'\x89PNG\r\n\x1a\n', 'not PNG'
          assert struct.unpack('>II',b[16:24])==(1200,630),'unexpected dimensions'
          print('PNG_ASSET_OK',len(b),'bytes; 1200x630')
          PY
      - name: Commit static PNG once (no runtime dependency or paid API)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/og-card.png
          if git diff --cached --quiet; then
            echo "Image already in Git."
          else
            git commit -m "Add static 1200x630 PNG for social previews"
            git push origin HEAD:main
          fi
