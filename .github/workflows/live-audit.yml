name: Audit live Cloudflare Pages
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: Public HTTPS preview now; owned production domain later
        required: true
        default: https://3d-printing-1r7.pages.dev
        type: string
      mode:
        description: Check prelaunch noindex or approved production indexing
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
  workflow_run:
    workflows: ["Code, math and SEO quality"]
    types: [completed]
permissions:
  contents: read
jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deployed commit and staging SEO without third-party APIs
        id: deploy_smoke
        env:
          SITE_URL: ${{ inputs.site_url || 'https://3d-printing-1r7.pages.dev' }}
          MODE: ${{ inputs.mode || 'staging' }}
          EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            echo "Cloudflare deploy readiness attempt $attempt"
            if node scripts/live-audit.mjs "$SITE_URL" "$MODE"; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then sleep 30; fi
          done
          echo "Live deployment did not pass the release gate."
          exit 1
      - name: Install CI-only Chrome controller
        run: npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1 axe-core@4.14.0 lighthouse@13.6.0
      - name: Browser QA on real Cloudflare preview
        env:
          SITE_URL: ${{ inputs.site_url || 'https://3d-printing-1r7.pages.dev' }}
        run: node scripts/browser-qa.mjs "$SITE_URL"
      - name: Independent customer checkout, Excel and print acceptance on live Cloudflare
        env:
          SITE_URL: ${{ inputs.site_url || 'https://3d-printing-1r7.pages.dev' }}
        run: node scripts/release-acceptance.mjs "$SITE_URL"
      - name: Recalculate real browser-download xlsx with LibreOffice Calc (not Microsoft Excel)
        run: |
          if ! command -v libreoffice >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libreoffice-calc
          fi
          libreoffice --version
          python3 scripts/libreoffice-acceptance.py
      - name: Install free Playwright WebKit browser engine for Safari-like checks
        if: ${{ !cancelled() && steps.deploy_smoke.outcome == 'success' }}
        run: ./node_modules/.bin/playwright install --with-deps webkit
      - name: Safari-like WebKit checks in iPhone-sized browser (not physical iOS)
        if: ${{ !cancelled() && steps.deploy_smoke.outcome == 'success' }}
        env:
          SITE_URL: ${{ inputs.site_url || 'https://3d-printing-1r7.pages.dev' }}
        run: node scripts/webkit-acceptance.mjs "$SITE_URL"
      - name: Measure mobile and desktop Lighthouse on Cloudflare
        if: ${{ !cancelled() && steps.deploy_smoke.outcome == 'success' }}
        env:
          SITE_URL: ${{ inputs.site_url || 'https://3d-printing-1r7.pages.dev' }}
        run: |
          mkdir -p qa-lighthouse
          npx --no-install lighthouse "$SITE_URL/" --quiet --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --only-categories=performance,accessibility,best-practices --output=json --output-path=qa-lighthouse/home-mobile.json
          npx --no-install lighthouse "$SITE_URL/" --quiet --preset=desktop --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --only-categories=performance,accessibility,best-practices --output=json --output-path=qa-lighthouse/home-desktop.json
          node scripts/lighthouse-report.mjs
      - name: Upload Lighthouse evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: printcost-lighthouse
          path: qa-lighthouse/
          retention-days: 7
          if-no-files-found: ignore
      - name: Publish screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: printcost-browser-qa
          path: qa-screenshots/
          retention-days: 7
          if-no-files-found: ignore

