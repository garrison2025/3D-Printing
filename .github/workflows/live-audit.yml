name: Audit live Cloudflare Pages
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: Public HTTPS preview now; owned production domain later
        required: true
        default: https://3d-printing-1r7.pages.dev
        type: string
      mode:
        description: Check prelaunch noindex or approved production indexing
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check deployed HTTP routes, robots, canonical and indexability
        env:
          SITE_URL: ${{ inputs.site_url }}
        run: node scripts/live-audit.mjs "$SITE_URL" "${{ inputs.mode }}"
