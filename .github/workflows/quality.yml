name: Code, math and SEO quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse-check every source and test JavaScript module
        run: find src scripts tests -name '*.mjs' -print0 | xargs -0 -n 1 node --check
      - name: Audit workbook formula source for new cost fields
        run: node scripts/inspect-workbook-formulas.mjs
      - name: Calculation and UI tests
        run: npm test
      - name: Production-style static build
        run: npm run build
        env:
          SITE_URL: https://3d-printing-1r7.pages.dev
      - name: Validate all published Excel OpenXML parts
        run: python3 scripts/validate-xlsx-xml.py dist/assets/3d-print-cost-calculator-template.xlsx
      - name: Staging SEO audit
        run: node scripts/audit.mjs
      - name: Keyword-to-page coverage audit
        run: node scripts/keyword-audit.mjs
      - name: Install test-only Chrome and Safari-like WebKit controller
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1 axe-core@4.14.0
          node node_modules/playwright-core/cli.js install --with-deps webkit
      - name: Test this exact built commit in local browser before Cloudflare deploy
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/printcost-testserver.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for retry in 1 2 3 4 5; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/browser-qa.mjs http://127.0.0.1:4173
          node scripts/webkit-acceptance.mjs http://127.0.0.1:4173
      - name: Custom-domain publication simulation (not deployed)
        run: |
          SITE_URL=https://example.org ENABLE_INDEXING=1 npm run build
          node scripts/audit.mjs
