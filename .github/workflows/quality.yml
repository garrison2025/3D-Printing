name: Code, math and SEO quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse-check every source and test JavaScript module
        run: find src scripts tests -name '*.mjs' -print0 | xargs -0 -n 1 node --check
      - name: Audit workbook formula source for new cost fields
        run: node scripts/inspect-workbook-formulas.mjs
      - name: Calculation and UI tests
        run: npm test
      - name: Production-style static build
        run: npm run build
        env:
          SITE_URL: https://3d-printing-1r7.pages.dev
      - name: Validate all published Excel OpenXML parts
        run: python3 scripts/validate-xlsx-xml.py dist/assets/3d-print-cost-calculator-template.xlsx
      - name: Staging SEO audit
        run: node scripts/audit.mjs
      - name: Keyword-to-page coverage audit
        run: node scripts/keyword-audit.mjs
      - name: Install test-only Chrome and Safari-like WebKit controller
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1 axe-core@4.14.0
          node node_modules/playwright-core/cli.js install --with-deps webkit
      - name: Test this exact built commit in local browser before Cloudflare deploy
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/printcost-testserver.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for retry in 1 2 3 4 5; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/browser-qa.mjs http://127.0.0.1:4173
          node scripts/webkit-acceptance.mjs http://127.0.0.1:4173
      - name: Upload accepted local Chrome and WebKit screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: printcost-v2-local-screenshots
          path: qa-screenshots/
          retention-days: 7
          if-no-files-found: ignore
      - name: Custom-domain publication simulation (not deployed)
        run: |
          SITE_URL=https://3dprintcostcalculator.org ENABLE_INDEXING=1 npm run build
          node scripts/audit.mjs
          # Exact Pages main build with old environment variables must index owned domain.
          CF_PAGES=1 CF_PAGES_BRANCH=main SITE_URL=https://3d-printing-1r7.pages.dev ENABLE_INDEXING=0 npm run build
          node scripts/audit.mjs
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('dist/build-manifest.json'));if(!m.indexable||m.canonicalOrigin!=='https://3dprintcostcalculator.org')process.exit(1)"

      - name: Verify reproducible GEO answer evidence in generated production HTML
        run: node scripts/geo-readiness-audit.mjs
      - name: Checkout pinned Website Starter Standard SEO auditor
        uses: actions/checkout@v4
        with:
          repository: chenmu2024/Website-Starter-Standard
          ref: e633805e57e18d4a11cc65966739de886f5a2b87
          path: _site-standard
          persist-credentials: false
      - name: Independent static SEO audit under Website Starter Standard
        run: |
          mkdir -p qa-seo
          python3 _site-standard/tools/seo_audit.py --site-dir dist --base-url https://3dprintcostcalculator.org --output qa-seo/standard-audit.json --fail-on error
          python3 scripts/seo-standard-triage.py qa-seo/standard-audit.json dist
          python3 - <<'PY'
          import json
          from pathlib import Path
          audit=json.loads(Path('qa-seo/standard-audit.json').read_text())
          print('Independent standard SEO check:',audit['pages_scanned'],'HTML files, findings:',audit['summary'])
          for finding in audit['findings']:
              if finding['severity']=='error':
                  print('ERROR',finding)
          PY
      - name: Upload independent standards-based SEO audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: printcost-standard-seo-audit
          path: qa-seo/standard-audit.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Independently diagnose owned-domain HTTPS and indexing readiness (read-only)
        if: always()
        run: node scripts/domain-readiness.mjs
      - name: Inspect all 12 owned-domain SEO pages (read-only; report blockers)
        if: always()
        run: node scripts/seo-live-audit.mjs
